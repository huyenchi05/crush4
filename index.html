<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Riot&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <style>
      .title span {
        font-size: 1.5em;
      }
    </style>

    <title>Xin lỗi anh</title>
  </head>

  <body>
    <main class="container">
      <img
        class="cat-img"
        src="https://media.giphy.com/media/SVkhYVCi8fKPKvypi6/giphy.gif"
        alt="Picture of a cat"
      />

      <p class="title">
        Anh ơi em xin lỗi nha 😭<br />

        <span>
          Em biết em sai rồi, anh đừng giận em nữa được không 🥲
        </span>
      </p>

      <div class="buttons">
        <button type="button" class="btn btn--yes">
          Anh tha lỗi cho em
        </button>

        <button type="button" class="btn btn--no">
          Không tha đâu
        </button>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
